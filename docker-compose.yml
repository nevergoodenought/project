services:
  web:
    build: .
    ports:
      - "5003:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:toor@db:5432/rusindb
      DICTIONARY_DATA_DIR: /usr/src/app/demo_data

  db:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rusindb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: toor
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rusindb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
